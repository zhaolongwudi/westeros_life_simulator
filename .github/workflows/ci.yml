name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --coverage
      - name: Regenerate content mirror (S16-7)
        # `assets/data/*.json` 是 `lib/data/*.dart` 的**生成物**。S16-7 之前它靠人工
        # 重跑 `dart_content_extract.py` 同步：本机没有 python3 时只能手改 JSON，
        # 那正是「三份真相」漂移的来源。现在 CI 每次自动重新生成，有变化就提交
        # （带 [skip ci] 防递归），于是 Dart 是唯一真相、镜像是产物——
        # 下面那道对账闸门仍然保留，用来抓「导出器本身解析坏了」这类问题。
        run: |
          git checkout main
          git pull --rebase origin main || true
          python3 scripts/dart_content_extract.py
          if [ -n "$(git status --porcelain assets/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data
            git commit -m "chore(content): 自动同步 assets/data 镜像 [skip ci]"
            git push origin main || true
            echo "mirror regenerated & pushed"
          else
            echo "mirror already in sync"
          fi
      - name: Content sync check (M4c)
        run: python3 scripts/check_content_sync.py --quiet
      - name: Docs sync check (S3-2)
        # 百科文档 ↔ assets/data 名称覆盖对账 + 脚本生成区块一致性。
        # 防止「文档写 100+、实际 38」这类注水，以及实体漏写复发。
        run: python3 scripts/check_docs_sync.py --quiet
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Auto-update README changelog
        # 测试通过后自动刷新 README「最近更新」区块（最近 3 条功能/修复 commit）。
        # 自动 commit 带 [skip ci] 防递归触发本 workflow；内容无变化时脚本跳过写入。
        # checkout 默认在 detached HEAD，先切回 main 再改文件再 push；
        # push 前先 rebase（远端可能有其他 auto-update commit），失败容错不拖垮 job。
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git checkout main
          git pull --rebase origin main || true
          # --stats 同时把 README 的内容数量刷成 Dart 真相源实时值（防 README 数量注水复发）
          python3 scripts/update_readme.py --changelog --stats
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs(readme): auto-update changelog [skip ci]"
            git push origin main || true
            echo "README changelog updated & pushed"
          else
            echo "README changelog unchanged, skip"
          fi