name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --coverage
      - name: Content sync check (M4c)
        run: python3 scripts/check_content_sync.py --quiet
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Auto-update README changelog
        # 测试通过后自动刷新 README「最近更新」区块（最近 3 条功能/修复 commit）。
        # 自动 commit 带 [skip ci] 防递归触发本 workflow；内容无变化时脚本跳过写入。
        # checkout 默认在 detached HEAD，先切回 main 再改文件再 push；
        # push 前先 rebase（远端可能有其他 auto-update commit），失败容错不拖垮 job。
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git checkout main
          git pull --rebase origin main || true
          python3 scripts/update_readme.py --changelog
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs(readme): auto-update changelog [skip ci]"
            git push origin main || true
            echo "README changelog updated & pushed"
          else
            echo "README changelog unchanged, skip"
          fi