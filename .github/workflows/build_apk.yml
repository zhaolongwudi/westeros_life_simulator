name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名（可选，默认取 pubspec version）'
        required: false
        default: ''

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2'
          cache: true

      - name: Generate platform folders
        # 本项目仓库不含 android/ 目录（纯 Dart 起步），CI 现场生成，保证构建可复现。
        # 生成后会新增模板 test/widget_test.dart（引用模板 MyApp），本项目入口是 WesterosApp，
        # 需删除该模板测试避免 analyze 报 creation_with_non_type。
        run: |
          flutter create --platforms=android --org com.westeros . --project-name westeros_life_simulator
          rm -f test/widget_test.dart
          echo "removed template widget_test.dart"
          ls test/ | head -5

      - name: Ensure minSdk >= 23 (flutter_secure_storage 9.x requirement)
        # flutter create 模板默认 minSdk=flutter.minSdkVersion(21)，flutter_secure_storage 9.x 要求 >=23
        # 生成后立即修正，保证后续 build apk 不因 minSdk 不足失败。
        run: |
          GRADLE="android/app/build.gradle"
          if grep -q "minSdkVersion 21" "$GRADLE"; then
            sed -i 's/minSdkVersion 21/minSdkVersion 23/' "$GRADLE"
            echo "minSdk bumped to 23"
          else
            echo "minSdk not 21 (or already set), current:"
            grep -n "minSdk" "$GRADLE" || true
          fi
          # 打印关键配置供排查
          grep -nE "namespace|applicationId|minSdk|targetSdk|compileSdk" "$GRADLE" | head -10

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK
        id: build
        run: |
          flutter build apk --release 2>&1 | tee build_output.log
          # 注意：不能用 -path ./build -prune（APK 恰好产在 build/ 下会被剪掉）
          APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Flutter build didn't produce APK, trying Gradle directly..."
            cd android && ./gradlew assembleRelease 2>&1 | tee -a ../build_output.log
            cd ..
            APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "BUILD_EXIT_CODE=0" > build_result.txt
            echo "APK_PATH=$APK_PATH" >> build_result.txt
          else
            echo "BUILD_EXIT_CODE=1" > build_result.txt
          fi
        timeout-minutes: 20

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_output.log
            build_result.txt
          retention-days: 14

      - name: Check build result
        id: apk
        run: |
          EXIT_CODE=$(grep BUILD_EXIT_CODE build_result.txt | cut -d= -f2)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Build failed with exit code: $EXIT_CODE"
            tail -100 build_output.log
            exit 1
          fi
          APK_PATH=$(grep APK_PATH build_result.txt | cut -d= -f2)
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          APK_PATH="${{ steps.apk.outputs.APK_PATH }}"
          APK_DIR=$(dirname "$APK_PATH")
          NAME="WesterosLige-nightly-${GITHUB_SHA:0:8}"
          cp "$APK_PATH" "$APK_DIR/$NAME.apk"
          cp "$APK_PATH" "$APK_DIR/WesterosLige.apk"
          echo "RENAMED_APK=$APK_DIR/$NAME.apk" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$APK_DIR/WesterosLige.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WesterosLige-nightly
          path: ${{ env.RENAMED_APK }}
          retention-days: 90

      - name: Publish Release (latest)
        # 每次构建成功发布正式版 Release：tag 用 apk-<sha8>（每次独立，可保留历史），
        # 同时更新 apk-latest 指向最新（保证 /releases/latest 与固定直链可用）。
        # 直链 https://github.com/zhaolongwudi/westeros_life_simulator/releases/latest/download/WesterosLige.apk
        # 永久指向最新正式版，点开即下载。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA8="${GITHUB_SHA:0:8}"
          TAG="apk-$SHA8"
          # 1) 创建带 SHA 的 release（每次独立，供 cleanup 保留 3 个历史）
          REL_JSON=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"WesterosLige $SHA8\",\"body\":\"自动构建正式版（commit $SHA8）\\n- 直链下载: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/WesterosLige.apk\\n- 测试: 790+ passed（CI run ${{ github.run_id }}）\",\"draft\":false,\"prerelease\":false}")
          REL_ID=$(echo "$REL_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          echo "RELEASE_ID=$REL_ID (tag $TAG)"
          if [ -z "$REL_ID" ]; then
            echo "release create failed: $REL_JSON" | head -c 400; exit 1
          fi
          # 2) 上传 asset（固定名 WesterosLige.apk，上传后直链生效）
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$RELEASE_APK" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$REL_ID/assets?name=WesterosLige.apk" \
            -o /tmp/asset.json -w "UPLOAD=%{http_code}\n"
          python3 -c "import json; d=json.load(open('/tmp/asset.json')); print('asset:', d.get('name'), '| size:', d.get('size'))"
          # 3) 更新 apk-latest 指向本 release（保证 /releases/latest/download 直链可用）
          curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/apk-latest" -o /dev/null -w "DELETE_OLD_LATEST=%{http_code}\n"
          LATEST_JSON=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"apk-latest\",\"name\":\"WesterosLige 最新版\",\"body\":\"最新正式版（commit $SHA8）\\n- 直链下载: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/WesterosLige.apk\",\"draft\":false,\"prerelease\":false}")
          LATEST_ID=$(echo "$LATEST_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          echo "LATEST_RELEASE_ID=$LATEST_ID"
          # 4) 给 apk-latest 也上传同一 asset（否则 /releases/latest/download/ 直链 404）
          if [ -n "$LATEST_ID" ]; then
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$RELEASE_APK" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$LATEST_ID/assets?name=WesterosLige.apk" \
              -o /tmp/asset_latest.json -w "UPLOAD_LATEST=%{http_code}\n"
            python3 -c "import json; d=json.load(open('/tmp/asset_latest.json')); print('latest asset:', d.get('name'), '| size:', d.get('size'))"
          fi
          echo "Release published: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/WesterosLige.apk"

      - name: Cleanup old releases (keep 3)
        # 每次发布后清理，只保留最近 3 个带 apk- 前缀的 Release（按 created_at 倒序），
        # apk-latest 别名不计入（它是固定指针）。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          def req(url, method="GET", data=None, ctype=None):
              h = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "User-Agent": "cleanup"}
              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  h["Content-Type"] = ctype or "application/json"
              r = urllib.request.Request(url, data=body, headers=h, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
          s, raw = req(f"https://api.github.com/repos/{repo}/releases?per_page=100")
          releases = json.loads(raw)
          vers = [r for r in releases if r.get("tag_name", "").startswith("apk-") and not r.get("tag_name", "").startswith("apk-latest")]
          keep = 3
          if len(vers) <= keep:
              print(f"versioned releases={len(vers)} <= {keep}, no cleanup")
          else:
              for rel in vers[keep:]:
                  rid = rel["id"]
                  s2, _ = req(f"https://api.github.com/repos/{repo}/releases/{rid}", method="DELETE")
                  print(f"deleted release {rel.get('tag_name')} id={rid} -> HTTP {s2}")
          PY

      - name: Send APK to email
        # 对齐 wpk-update-notifier：SMTP 凭据走仓库 Secrets（SMTP_USER/SMTP_AUTH_CODE/SMTP_TO）。
        # 未配置 Secrets 时脚本自动跳过发信（exit 0），不影响构建结果。
        env:
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/build_and_mail_apk.py --send --apk "${{ env.RENAMED_APK }}" --run-id "$RUN_ID"

      - name: Auto-update README download center
        # 构建成功后自动刷新 README「下载中心」区块（Release 直链 + 最新 SHA）。
        # 自动 commit 带 [skip ci] 防递归触发 CI；内容无变化时脚本跳过写入。
        # checkout 默认在 detached HEAD，先切回 main 再改文件再 push；
        # push 前先 rebase（远端可能有其他 auto-update commit），失败容错不拖垮 job。
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git checkout main
          git pull --rebase origin main || true
          python3 scripts/update_readme.py --download
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs(readme): auto-update download center (run ${{ github.run_id }}) [skip ci]"
            git push origin main || true
            echo "README download center updated & pushed"
          else
            echo "README readme unchanged, skip"
          fi
