name: Build APK

on:
  workflow_dispatch:
    inputs:
      # S1-4：版本名**固定取 version.txt**（见 Build APK 步骤），本 input 已不再使用，
      # 保留仅为兼容旧的手动触发方式。真相源只有一个：version.txt。
      version_name:
        description: '（已废弃，保留兼容）版本固定取 version.txt'
        required: false
        default: ''

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2'
          cache: true

      - name: Generate platform folders
        # 本项目仓库不含 android/ 目录（纯 Dart 起步），CI 现场生成，保证构建可复现。
        # 生成后会新增模板 test/widget_test.dart（引用模板 MyApp），本项目入口是 WesterosApp，
        # 需删除该模板测试避免 analyze 报 creation_with_non_type。
        run: |
          flutter create --platforms=android --org com.westeros . --project-name westeros_life_simulator
          rm -f test/widget_test.dart
          echo "removed template widget_test.dart"
          ls test/ | head -5

      - name: Ensure minSdk >= 23 (flutter_secure_storage 9.x requirement)
        # flutter create 模板默认 minSdk=flutter.minSdkVersion(21)，flutter_secure_storage 9.x 要求 >=23
        # 生成后立即修正，保证后续 build apk 不因 minSdk 不足失败。
        run: |
          GRADLE="android/app/build.gradle"
          if grep -q "minSdkVersion 21" "$GRADLE"; then
            sed -i 's/minSdkVersion 21/minSdkVersion 23/' "$GRADLE"
            echo "minSdk bumped to 23"
          else
            echo "minSdk not 21 (or already set), current:"
            grep -n "minSdk" "$GRADLE" || true
          fi
          # 打印关键配置供排查
          grep -nE "namespace|applicationId|minSdk|targetSdk|compileSdk" "$GRADLE" | head -10

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK
        id: build
        run: |
          VERSION=$(cat version.txt)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"
          flutter build apk --release --build-name="$VERSION" --build-number="$(echo "$VERSION" | awk -F. '{print $3}')" 2>&1 | tee build_output.log
          # 注意：不能用 -path ./build -prune（APK 恰好产在 build/ 下会被剪掉）
          APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Flutter build didn't produce APK, trying Gradle directly..."
            cd android && ./gradlew assembleRelease 2>&1 | tee -a ../build_output.log
            cd ..
            APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "BUILD_EXIT_CODE=0" > build_result.txt
            echo "APK_PATH=$APK_PATH" >> build_result.txt
          else
            echo "BUILD_EXIT_CODE=1" > build_result.txt
          fi
        timeout-minutes: 20

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_output.log
            build_result.txt
          retention-days: 14

      - name: Check build result
        id: apk
        run: |
          EXIT_CODE=$(grep BUILD_EXIT_CODE build_result.txt | cut -d= -f2)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Build failed with exit code: $EXIT_CODE"
            tail -100 build_output.log
            exit 1
          fi
          APK_PATH=$(grep APK_PATH build_result.txt | cut -d= -f2)
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          APK_PATH="${{ steps.apk.outputs.APK_PATH }}"
          APK_DIR=$(dirname "$APK_PATH")
          NAME="WesterosLige-nightly-${GITHUB_SHA:0:8}"
          cp "$APK_PATH" "$APK_DIR/$NAME.apk"
          cp "$APK_PATH" "$APK_DIR/WesterosLige.apk"
          cp "$APK_PATH" "$APK_DIR/WesterosLige-v${{ env.VERSION }}.apk"
          echo "RENAMED_APK=$APK_DIR/$NAME.apk" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$APK_DIR/WesterosLige.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WesterosLige-nightly
          path: ${{ env.RENAMED_APK }}
          retention-days: 90

      - name: Publish Release (v${{ env.VERSION }})
        # 每次构建成功发布正式版 Release：tag 用 v<版本号>（0.0.1 → 0.0.2 → 0.0.3…），上传固定名 asset WesterosLige.apk。
        # GitHub 原生 /releases/latest 会自动指向最新创建的 release。
        # 注意：本仓库为 private，未登录访问 release/asset 一律 404（GitHub 隐藏私有仓库存在性），
        # 登录 GitHub 账号后直链 https://github.com/<repo>/releases/latest/download/WesterosLige.apk 可用。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ env.VERSION }}"
          SHA8="${GITHUB_SHA:0:8}"
          TAG="v$VERSION"
          REL_JSON=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"WesterosLige v$VERSION\",\"body\":\"自动构建正式版（commit $SHA8）\\n- 版本: v$VERSION\\n- 直链下载（需登录 GitHub）: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/WesterosLige.apk\\n- 测试: 790+ passed（CI run ${{ github.run_id }}）\",\"draft\":false,\"prerelease\":false}")
          REL_ID=$(echo "$REL_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$REL_ID" ]; then
            # already_exists（版本号重复，可能因上一轮递增 commit push 丢失导致 version.txt 未推进）：
            # 复用已存在 release，幂等继续（不整 job 红）
            if echo "$REL_JSON" | grep -q 'already_exists'; then
              echo "tag $TAG already exists, reusing existing release (idempotent)"
              REL_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
            fi
          fi
          echo "RELEASE_ID=$REL_ID (tag $TAG)"
          if [ -z "$REL_ID" ]; then
            echo "release create failed: $REL_JSON" | head -c 400; exit 1
          fi
          # 若该 release 已有同名 asset 则报错跳过（幂等重跑），否则上传
          ASSET_EXISTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$REL_ID/assets" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(any(a.get('name')=='WesterosLige.apk' for a in d))")
          if [ "$ASSET_EXISTS" = "True" ]; then
            echo "asset WesterosLige.apk already exists on release $TAG, skip upload (idempotent)"
          else
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$RELEASE_APK" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$REL_ID/assets?name=WesterosLige.apk" \
              -o /tmp/asset.json -w "UPLOAD=%{http_code}\n"
            python3 -c "import json; d=json.load(open('/tmp/asset.json')); print('asset:', d.get('name'), '| size:', d.get('size'))"
          fi
          echo "Release published: tag=$TAG (GitHub /releases/latest 自动指向它)"

      - name: Cleanup old releases (keep 3)
        # 每次发布后清理，只保留最近 3 个带 v 前缀的 Release（0.0.x 版本，按 created_at 倒序）。
        # 旧式 apk-<sha8> release 一并清理（不属于版本序列）。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          def req(url, method="GET", data=None, ctype=None):
              h = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "User-Agent": "cleanup"}
              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  h["Content-Type"] = ctype or "application/json"
              r = urllib.request.Request(url, data=body, headers=h, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
          s, raw = req(f"https://api.github.com/repos/{repo}/releases?per_page=100")
          releases = json.loads(raw)
          vers = [r for r in releases if r.get("tag_name", "").startswith("v")]
          keep = 3
          if len(vers) <= keep:
              print(f"versioned releases={len(vers)} <= {keep}, no cleanup")
          else:
              for rel in vers[keep:]:
                  rid = rel["id"]
                  s2, _ = req(f"https://api.github.com/repos/{repo}/releases/{rid}", method="DELETE")
                  print(f"deleted release {rel.get('tag_name')} id={rid} -> HTTP {s2}")
          # 清理旧式 apk-<sha8> release（不属于 0.0.x 版本序列）
          old = [r for r in releases if r.get("tag_name", "").startswith("apk-")]
          for rel in old:
              rid = rel["id"]
              s2, _ = req(f"https://api.github.com/repos/{repo}/releases/{rid}", method="DELETE")
              print(f"deleted legacy release {rel.get('tag_name')} id={rid} -> HTTP {s2}")
          PY

      - name: Send APK to email
        # 对齐 wpk-update-notifier：SMTP 凭据走仓库 Secrets（SMTP_USER/SMTP_AUTH_CODE/SMTP_TO）。
        # 未配置 Secrets 时脚本自动跳过发信（exit 0），不影响构建结果。
        # 发送带版本号的 APK（WesterosLige-v<版本>.apk），便于用户识别正式版。
        env:
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          RUN_ID: ${{ github.run_id }}
        run: |
          VERSIONED_APK=$(dirname "${{ env.RENAMED_APK }}")/WesterosLige-v${{ env.VERSION }}.apk
          ls -la "$VERSIONED_APK" && python3 scripts/build_and_mail_apk.py --send --apk "$VERSIONED_APK" --run-id "$RUN_ID"

      - name: Auto-update README download center
        # 构建成功后自动刷新 README「下载中心」区块（Release 直链 + 版本号），并递增 version.txt（0.0.1 → 0.0.2）。
        # 自动 commit 带 [skip ci] 防递归触发 CI；内容无变化时跳过写入。
        # checkout 默认在 detached HEAD，先切回 main 再改文件再 push；
        # push 前先 rebase（远端可能有其他 auto-update commit），失败容错不拖垮 job。
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git checkout main
          git pull --rebase origin main || true
          VERSION=$(cat version.txt)
          echo "本次发布版本: v$VERSION"
          python3 scripts/update_readme.py --download --version "$VERSION"
          # 递增版本号写回 version.txt（下次构建用新版本）
          NEW_VERSION=$(echo "$VERSION" | awk -F. '{print $1"."$2"."($3+1)}')
          echo "$NEW_VERSION" > version.txt
          echo "下次构建版本: v$NEW_VERSION"
          if [ -n "$(git status --porcelain README.md version.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md version.txt
            git commit -m "docs(readme): auto-update download center (run ${{ github.run_id }}) v$VERSION [skip ci]"
            # push 前再 rebase：两个 auto-update 链路（本步骤 + ci.yml changelog）会并发 push，
            # 远端可能在 commit 后被对方抢先 push → 非快进被拒；重试一次更稳。
            for i in 1 2; do
              git pull --rebase origin main || true
              if git push origin main 2>&1; then
                echo "push OK (attempt $i)"
                break
              fi
              echo "push failed (attempt $i), retrying..."
              sleep 3
            done
            echo "README download center updated & pushed (v$VERSION → v$NEW_VERSION)"
          else
            echo "README readme unchanged, skip"
          fi
